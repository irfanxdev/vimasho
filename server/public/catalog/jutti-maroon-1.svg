<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
    
    <defs>
      <linearGradient id="bg-jutti-maroon-1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F1E9D8" />
        <stop offset="100%" stop-color="#E4D8BE" />
      </linearGradient>
      <radialGradient id="shadow-jutti-maroon-1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00000022" />
        <stop offset="100%" stop-color="#00000000" />
      </radialGradient>
    </defs>
    <rect width="700" height="900" fill="url(#bg-jutti-maroon-1)" />
    <ellipse cx="350" cy="810" rx="180" ry="34" fill="url(#shadow-jutti-maroon-1)" />
  
    <g transform="translate(170, 480)">
      <!-- sole -->
      <path d="M -10 78 C -14 96, 30 112, 110 110 L 330 96 C 358 94, 366 82, 352 70
               C 300 76, 200 82, 110 84 C 50 85, 6 82, -10 78 Z"
            fill="#320e13" stroke="#401218" stroke-width="1.5" />
      <!-- upper body of the jutti, curving up to a pointed, slightly upturned toe -->
      <path d="M -6 76 C -10 40, 20 6, 90 -4 C 160 -12, 230 -6, 280 8
               C 320 20, 348 8, 366 -18 C 372 -30, 366 -40, 352 -34
               C 330 -24, 300 4, 250 10 C 190 18, 120 14, 66 30
               C 24 42, 2 58, -6 76 Z"
            fill="#5B1A22" stroke="#401218" stroke-width="2.2" />
      <!-- vamp seam -->
      <path d="M 40 46 C 80 24, 150 12, 210 16" fill="none" stroke="#401218" stroke-width="1.4" opacity="0.8" />
      <!-- embroidered motif on the toe -->
      <circle cx="86" cy="30" r="13" fill="none" stroke="#BF9B30" stroke-width="1.6" />
      <circle cx="86" cy="30" r="4.5" fill="#BF9B30" />
      <circle cx="112" cy="24" r="2" fill="#BF9B30" opacity="0.85" /><circle cx="127" cy="22" r="2" fill="#BF9B30" opacity="0.85" /><circle cx="142" cy="20" r="2" fill="#BF9B30" opacity="0.85" /><circle cx="157" cy="18" r="2" fill="#BF9B30" opacity="0.85" /><circle cx="172" cy="16" r="2" fill="#BF9B30" opacity="0.85" />
    </g>
    
    <g transform="translate(350,700) scale(1)">
      <line x1="-26" y1="0" x2="-10" y2="0" stroke="#BF9B30" stroke-width="1.4" />
      <line x1="10" y1="0" x2="26" y2="0" stroke="#BF9B30" stroke-width="1.4" />
      <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke="#BF9B30" stroke-width="1.4" fill="none" />
      <rect x="-2.5" y="-2.5" width="5" height="5" transform="rotate(45)" fill="#BF9B30" />
    </g>
  
  </svg>